[package]
name = "brew-vault"
version = "0.1.2"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop", "router", "signals"] }
totp-rs = { version = "5.7.2", features = ["gen_secret", "serde_support"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"] }
dirs = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["v4"] }
chrono = "0.4.45"
tokio = { version = "1.53.1", features = ["full"] }
argon2 = { version = "0.6.0", features = ["std"] }
aes-gcm = "0.11.1"
rfd = "0.17.2"
thiserror = "2.0.20"
base64 = "0.23.1"
rand_core = "0.10.1"
getrandom = "0.4.3"

[profile.release]
opt-level = "z"
strip = true
lto = true

[dev-dependencies]
tempfile = "3.27.0"
